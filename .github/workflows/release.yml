name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          if command -v sudo >/dev/null; then
            SUDO="sudo"
          else
            SUDO=""
          fi
          $SUDO apt-get update
          $SUDO apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Build
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_linux.sh

      - name: Verify FFI libs bundled
        run: |
          ls -la dist/
          tar tzf dist/*.tar.gz | grep -E 'lib/(liblumen_core|libfscore|libublock)\.so|lumen-cli'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-linux
          path: dist/*.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-apple-darwin
      - name: Build and stage FFI libs
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_macos.sh
      - name: Verify signatures and bundle
        run: |
          ls -la dist/
          codesign --verify --deep --strict "ui/build/macos/Build/Products/Release/Lumen.app"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-macos
          path: dist/*.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build
        shell: bash
        run: |
          ./scripts/build_windows.sh
      - name: Verify DLLs bundled
        shell: bash
        run: |
          ls -la dist/
          unzip -l dist/*.zip | grep -E 'lib/(lumen_core|fscore|ublock)\.dll|lumen-cli\.exe'
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-windows
          path: dist/*.zip

  release:
    name: Create GitHub Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            lumen-linux/*.tar.gz
            lumen-macos/*.zip
            lumen-windows/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
