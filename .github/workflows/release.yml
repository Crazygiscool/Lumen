# Lumen's Flutter shell is desktop-only (it uses dart:ffi + window_manager),
# so this matrix covers every Flutter target the app supports:
#   Linux   -> tar.gz, .deb, AppImage
#   macOS   -> .app zip
#   Windows -> portable zip, Inno Setup installer (.exe)
#
# Pushing a v* tag (or running this workflow against a tag) builds all three
# platforms and publishes the artifacts to a GitHub Release.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux (tar.gz, deb, AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            dpkg file curl

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Build release artifacts
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_linux.sh

      - name: Verify Linux artifacts
        run: |
          set -euo pipefail
          ls -lh dist/
          test -f dist/*.tar.gz
          test -f dist/*.deb
          test -f dist/*.AppImage
          tar tzf dist/*.tar.gz | grep -E 'lib/liblumen_core\.so|lumen-cli'
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb | grep -E 'opt/lumen/lumen|usr/bin/lumen'
          file dist/*.AppImage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumen-linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  build-macos:
    name: macOS (zip)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build release artifacts
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_macos.sh

      - name: Verify macOS app and archive
        run: |
          set -euo pipefail
          ls -lh dist/
          APP="ui/build/macos/Build/Products/Release/Lumen.app"
          test -d "$APP"
          test -f "$APP/Contents/MacOS/lib/liblumen_core.dylib"
          codesign --verify --deep --strict "$APP"
          unzip -l dist/*.zip | grep -E 'Lumen\.app/Contents/MacOS/lumen|lumen-cli'

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumen-macos
          path: dist/*.zip
          if-no-files-found: error

  build-windows:
    name: Windows (zip, Inno Setup)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Inno Setup
        shell: bash
        run: choco install innosetup -y --no-progress

      - name: Build release artifacts
        shell: bash
        run: |
          ./scripts/build_windows.sh

      - name: Verify Windows artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist/
          test -f dist/Lumen-windows-v*.zip
          test -f dist/Lumen-windows-v*-setup.exe
          unzip -l dist/*.zip | grep -E 'lib/lumen_core\.dll|lumen-cli\.exe'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumen-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show release assets
        run: ls -lh artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
