[package]
name = "lumen-tui"
version = "3.2.1"
edition = "2021"

[[bin]]
name = "lumen"
path = "src/main.rs"

[dependencies]
lumen_core = { path = "../core", package = "lumen" }
clap = { version = "4.4", features = ["derive", "env"] }
chrono = "0.4"
dirs = "6.0"
ratatui = "0.26"
crossterm = { version = "0.28", features = ["events"] }
color-eyre = "0.6"
termimad = "0.30"
