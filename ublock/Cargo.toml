[package]
name = "ublock"
version = "0.1.0"
edition = "2021"
description = "Lumen ad-blocking engine: parses uBlock Origin filter lists and compiles WebKit content-rule JSON"

[lib]
name = "ublock"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
regex = "1"