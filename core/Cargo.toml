[package]
name = "lumen"
version = "4.0.2"
edition = "2021"   # 2024 is not a valid Rust edition (yet)

[lib]
name = "lumen_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
lazy_static = "1.4"
serde_json = "1"
base64 = "0.21"
dirs = "6.0"
libloading = "0.8"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Phase 1: Knowledge Base
tantivy = "0.22"
serde_yaml = "0.9"
regex = "1.10"
walkdir = "2.5"
shellexpand = "2.1"
# Phase 2: Sync
hex = "0.4"
uuid = { version = "1.0", features = ["serde", "v4"] }
tar = "0.4"
flate2 = "1.0"
age = "0.12"
age-core = "0.12"
sha2 = "0.10"
remotefs = { version = "1.0", features = ["tokio"] }
remotefs-webdav = { version = "1.0", features = ["tokio"] }
dav-xml-client = "0.2"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread"] }
keyring = "4"
# Phase 3: Cross-Platform
reqwest = { version = "0.11", features = ["blocking", "json"] }
# Phase 4: Power User
wasmtime = { version = "18", features = ["cranelift", "async"] }
wasmtime-wasi = { version = "18" }
tower-lsp = { version = "0.19", features = ["tokio"] }

[dev-dependencies]
tempfile = "3.27"
