name: lumen
base: core20
version: '3.2.3'
summary: Private, encrypted Markdown journal
description: |
  Lumen is an offline-first, encrypted personal journal with Markdown editing,
  Wikilinks, backlinks, full-text search, and a terminal client. Notes are
  encrypted with AES-256-GCM and synced peer-to-peer via Syncthing or WebDAV.
grade: stable
confinement: strict
icon: ui/lib/assets/lumen_logo.png

plugs:
  - home
  - network
  - wayland
  - x11
  - unity7
  - desktop
  - desktop-legacy
  - gsettings
  - libsecret

parts:
  lumen-core:
    plugin: rust
    source: .
    rust-channel: stable
    build-packages:
      - clang
      - cmake
      - ninja-build
      - pkg-config
      - libgtk-3-dev
      - liblzma-dev
      - libsecret-1-dev
    override-build: |
      cd $SNAPCRAFT_PROJECT_DIR
      cargo build --release --locked
      install -d $SNAPCRAFT_PART_INSTALL/lib/lumen
      cp target/release/liblumen_core.so $SNAPCRAFT_PART_INSTALL/lib/lumen/
      install -D target/release/lumen $SNAPCRAFT_PART_INSTALL/bin/lumen-cli

  lumen-app:
    after: [lumen-core]
    plugin: flutter
    source: .
    flutter-target: linux
    build-packages:
      - clang
      - cmake
      - ninja-build
      - pkg-config
      - libgtk-3-dev
      - liblzma-dev
      - libsecret-1-dev
    override-build: |
      cd $SNAPCRAFT_PROJECT_DIR/ui
      flutter config --enable-linux-desktop
      flutter build linux --release
      # Stage the Rust FFI library into the bundle so the Flutter app can load it
      install -d $SNAPCRAFT_PART_INSTALL/lib/lumen
      cp $SNAPCRAFT_PROJECT_DIR/target/release/liblumen_core.so \
        $SNAPCRAFT_PART_INSTALL/lib/lumen/liblumen_core.so
      # Copy the Flutter bundle into the snap
      cp -r build/linux/x64/release/bundle/* $SNAPCRAFT_PART_INSTALL/lib/lumen/
      # Stage the TUI binary
      install -D $SNAPCRAFT_PROJECT_DIR/target/release/lumen \
        $SNAPCRAFT_PART_INSTALL/bin/lumen-cli

apps:
  lumen:
    command: lumen
    command-chain:
      - snap/command-chain/desktop-launch
    plugs:
      - home
      - network
      - wayland
      - x11
      - unity7
      - desktop
      - desktop-legacy
      - gsettings
      - libsecret
    environment:
      LD_LIBRARY_PATH: $SNAP/lib/lumen
    desktop: usr/share/applications/lumen.desktop

  lumen-cli:
    command: lumen-cli
    plugs:
      - home
    environment:
      LD_LIBRARY_PATH: $SNAP/lib/lumen
